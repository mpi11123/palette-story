// 疑似AI: 色カテゴリから組み合わせでタイトルを生成
function shuffle(arr, seed=0) {
  const a=[...arr]; let s=seed+1;
  for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getColorCategory(colors) {
  if (!colors.length) return 'neutral';
  const avg=colors.reduce((a,hex)=>[
    a[0]+parseInt(hex.slice(1,3),16),
    a[1]+parseInt(hex.slice(3,5),16),
    a[2]+parseInt(hex.slice(5,7),16)
  ],[0,0,0]).map(v=>v/colors.length);
  const sat=getSat(avg);
  if(sat<0.1) return 'neutral';
  const h=Math.round(getHue(avg)*360);
  if(h<=30||h>=330) return 'pink';
  if(h<=75) return 'warm';
  if(h<=165) return 'green';
  if(h<=270) return 'blue';
  return 'pink';
}

// 抽出した色のHEXから日本語・英語の色名を返す
function getColorLabel(hex, lang) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  const sat=mx===0?0:(mx-mn)/mx;
  const br=(r*299+g*587+b*114)/1000;
  const hue=mx===mn?0:mx===r?((g-b)/(mx-mn)+6)%6:mx===g?(b-r)/(mx-mn)+2:(r-g)/(mx-mn)+4;
  const h=Math.round(hue/6*360);
  if(sat<0.1){
    if(br>220) return lang==='ja'?['白','透明感のある','ミルキーな']:['White','Ivory','Milky'];
    if(br>160) return lang==='ja'?['グレー','スモーキーな','霞のような']:['Gray','Smoky','Misty'];
    return lang==='ja'?['黒','ダークな','深い']:['Black','Dark','Deep'];
  }
  if(h<=30||h>=330){
    if(br>200) return lang==='ja'?['ピンク','ローズ','桜色の']:['Pink','Rose','Blush'];
    if(br>130) return lang==='ja'?['テラコッタ','珊瑚色の','コーラル']:['Terracotta','Coral','Dusty Rose'];
    return lang==='ja'?['レッド','深紅の','クリムゾン']:['Red','Crimson','Burgundy'];
  }
  if(h<=75){
    if(br>200) return lang==='ja'?['イエロー','バター色の','レモン']:['Yellow','Butter','Lemon'];
    if(br>130) return lang==='ja'?['アンバー','キャラメルの','マスタード']:['Amber','Caramel','Mustard'];
    return lang==='ja'?['ブラウン','チョコレートの','コーヒー']:['Brown','Chocolate','Coffee'];
  }
  if(h<=165){
    if(br>200) return lang==='ja'?['グリーン','セージ','ミント']:['Green','Sage','Mint'];
    if(br>130) return lang==='ja'?['オリーブ','フォレスト','深緑']:['Olive','Forest','Fern'];
    return lang==='ja'?['ダークグリーン','深緑','苔色']:['Dark Green','Moss','Forest'];
  }
  if(h<=255){
    if(br>200) return lang==='ja'?['ブルー','スカイ','水色']:['Blue','Sky','Powder Blue'];
    if(br>130) return lang==='ja'?['ブルー','スレート','デニム']:['Blue','Slate','Denim'];
    return lang==='ja'?['ネイビー','インディゴ','深藍']:['Navy','Indigo','Deep Blue'];
  }
  if(br>200) return lang==='ja'?['ラベンダー','ライラック','紫']:['Lavender','Lilac','Violet'];
  return lang==='ja'?['パープル','プラム','バイオレット']:['Purple','Plum','Violet'];
}

function generateTitles(cat, lang, seed, count=4, extractedColors=[]) {
  // ── 1. 抽出色ベースのタイトル ──
  const colorTitles = [];
  for (const hex of extractedColors) {
    const labels = getColorLabel(hex, lang);
    if (lang==='ja') {
      const moods = ['のきおく','のじかん','のいろ','のひとひら','のひとこと','がすき','がかわいい','の午後','の空気','のかけら'];
      const adjs2 = ['やさしい','ふわりとした','淡い','すきな','小さな'];
      for (const l of labels) {
        // ラベル末尾の「の」を除去して助詞重複を防ぐ（例：キャラメルの+のじかん→キャラメルのじかん）
        const base = l.endsWith('の') ? l.slice(0,-1) : l;
        for (const m of moods.slice(0,3)) colorTitles.push(base+m);
        for (const a of adjs2.slice(0,2)) colorTitles.push(a+base);
      }
    } else {
      const moods = ['Memory','Moment','Story','Mood','Note','Color','Day','Feeling'];
      const adjs2 = ['Soft','Gentle','Little','Sweet','Quiet'];
      for (const l of labels) {
        for (const m of moods.slice(0,3)) colorTitles.push(l+' '+m);
        for (const a of adjs2.slice(0,2)) colorTitles.push(a+' '+l);
      }
    }
  }

  // ── 2. 汎用タイトル（どんな写真にも合う）──
  const universal = lang==='ja'
    ? ['今日のいろ','小さな幸せ','ひとやすみ','きょうのかけら','なんでもない日','すきなもの','余白の時間','ちいさなきろく','いつかのきおく','そのままで','ひとときの','ゆっくりと','たいせつなもの','日々のいろ','きれいなもの','ふとしたとき','やわらかな日','ちいさなこと','いろのきろく','毎日のいろ']
    : ['Color Story','Daily Notes','Little Moments','Soft Life','Color Diary','Just This','Slow Morning','Color Memory','Everyday','Tiny Record','Color Notes','Still Life','Color Palette','My Colors','Color Mood'];

  // ── 3. 混ぜてシャッフル（色ベース2〜3個＋汎用1〜2個）──
  const colorPicked = shuffle([...new Set(colorTitles)], seed).slice(0, count*2);
  const univPicked  = shuffle(universal, seed+1).slice(0, count);
  const all = shuffle([...colorPicked, ...univPicked], seed+2);
  const unique = [...new Set(all)].slice(0, count*3);

  if (lang==='en') {
    // 英語タイトルに日本語訳を添える
    // 抽出色の英語ラベル→日本語ラベルのマップを作る
    const enToJa = {};
    for (const hex of extractedColors) {
      const jaLabels = getColorLabel(hex, 'ja');
      const enLabels = getColorLabel(hex, 'en');
      enLabels.forEach((en,i)=>{ if(jaLabels[i]) enToJa[en]=jaLabels[i]; });
    }
    // 汎用訳
    const univJa = {
      'Color Story':'色の物語','Daily Notes':'日々の記録','Little Moments':'ちいさなひとときの',
      'Soft Life':'やわらかな暮らし','Color Diary':'色日記','Just This':'そのままで',
      'Slow Morning':'ゆっくりとした朝','Color Memory':'色のきおく','Everyday':'日常',
      'Tiny Record':'ちいさな記録','Color Notes':'色メモ','Still Life':'静物',
      'Color Palette':'カラーパレット','My Colors':'わたしのいろ','Color Mood':'色の気分',
    };
    return shuffle(unique, seed+3).slice(0,count).map(title=>{
      // 1. タイトル全体が辞書にある → その訳を使う
      if (univJa[title]) return {title, ja:`（${univJa[title]}）`};
      // 2. 各単語を個別に訳す（色名など）
      const words = title.split(' ');
      const jaWords = words.map(w=>enToJa[w]).filter(Boolean);
      const ja = jaWords.length ? `（${jaWords.join('')}）` : '';
      return {title, ja};
    });
  }
  return shuffle(unique, seed+3).slice(0,count).map(t=>({title:t, ja:''}));
}

// COLOR UTILITIES
// ─────────────────────────────────────────────
function dist(a, b) { return (a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2; }
function toHex(r,g,b) { return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function soften(r,g,b) { return toHex(r+(255-r)*.5,g+(255-g)*.5,b+(255-b)*.5); }

function kmeans(px, k, seed=0) {
  const step=Math.floor(px.length/k);
  const off=(seed*17)%Math.max(1,px.length);
  let c=Array.from({length:k},(_,i)=>px[(off+i*step)%px.length]||[128,128,128]);
  for (let t=0;t<15;t++) {
    const cl=Array.from({length:k},()=>[]);
    for (const p of px) { let b=0,bd=Infinity; for (let i=0;i<k;i++){const d=dist(p,c[i]);if(d<bd){bd=d;b=i;}} cl[b].push(p); }
    c=cl.map(g=>{if(!g.length)return[128,128,128];const a=[0,0,0];for(const p of g){a[0]+=p[0];a[1]+=p[1];a[2]+=p[2];}return a.map(v=>Math.round(v/g.length));});
  }
  return c;
}

function getHue([r,g,b]) {
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  if(mx===mn) return 0;
  return mx===r?(g-b)/(mx-mn)/6+(g<b?1:0):mx===g?(b-r)/(mx-mn)/6+1/3:(r-g)/(mx-mn)/6+2/3;
}
function getSat([r,g,b]) { const mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx===0?0:(mx-mn)/mx; }
function getBr([r,g,b]) { return (r*299+g*587+b*114)/1000; }

function rgbInfo([r,g,b]) {
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
  const hue=Math.round(getHue([r,g,b])*360);
  const sat=mx===0?0:(mx-mn)/mx;
  const br=getBr([r,g,b]);
  const light=(mx+mn)/2;
  return {h:hue,s:sat,br,light};
}
function hueDiff(a,b){const d=Math.abs(a-b);return Math.min(d,360-d);}
function toneDistance(a,b){
  const ia=rgbInfo(a), ib=rgbInfo(b);
  return hueDiff(ia.h,ib.h)*2.2 + Math.abs(ia.light-ib.light)*0.55 + Math.abs(ia.s-ib.s)*80;
}

// sRGB → CIE Lab。小さな自前実装で、候補色どうしの知覚的な距離を評価する。
function rgbToLab([r,g,b]){
  const linear=v=>{
    v/=255;
    return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);
  };
  r=linear(r); g=linear(g); b=linear(b);
  let x=(r*.4124564+g*.3575761+b*.1804375)/.95047;
  let y=(r*.2126729+g*.7151522+b*.0721750);
  let z=(r*.0193339+g*.1191920+b*.9503041)/1.08883;
  const f=v=>v>.008856?Math.cbrt(v):(7.787*v+16/116);
  x=f(x); y=f(y); z=f(z);
  return [116*y-16,500*(x-y),200*(y-z)];
}
function labDistance(a,b){
  return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
}
function clamp01(v){return Math.max(0,Math.min(1,v));}

// Natural用のトーン分類。HSV彩度だけでは淡いラベンダー等がグレー扱いになるため、
// Labの色度（a/b平面の距離）を併用して「真の無彩色」と「淡い有彩色」を分ける。
function classifyNaturalTone(info,lab){
  const chroma=Math.hypot(lab[1],lab[2]);
  const isTrueGray=chroma<4.5;
  const isNearNeutral=chroma<3.2;
  const isPaleChromatic=
    info.br>=145&&info.br<248&&chroma>=4.5&&info.s>=.03&&info.s<.30;
  const pastel=
    info.br>165&&info.br<248&&(info.s>.08||isPaleChromatic);
  return {chroma,isTrueGray,isNearNeutral,isPaleChromatic,pastel};
}

// Naturalの候補を、写真との関連性を残しながらLab上で離れた色から選ぶ。
// 先にアクセント・淡い有彩色・支え色の入口を確保し、残りは既選択色との
// 最小知覚色差を加点して1色ずつ決める。色自体の加工は行わない。
function selectNaturalDiverseCandidates(candidates,count=30){
  const pool=[];
  for(const candidate of candidates){
    if(!pool.some(o=>o.hex===candidate.hex))pool.push(candidate);
  }
  const chosen=[];
  // 暗色は一律に減らさない。全体クラスタが示す暗部面積から必要数を決め、
  // 髪・夜景・影が写真の印象を担う場合は複数残す一方、同じ役割の黒や焦げ茶は抑える。
  const isDarkTone=o=>o.info.br<95;
  const isWarmDark=o=>isDarkTone(o)&&
    ((o.info.h<70||o.info.h>335)&&o.info.s<.62);
  const globalDarkCoverage=Math.min(1,pool.reduce((sum,o)=>
    !o.regional&&isDarkTone(o)?sum+(o.area||0):sum,0));
  const globalDeepDarkCoverage=Math.min(1,pool.reduce((sum,o)=>
    !o.regional&&o.info.br<60?sum+(o.area||0):sum,0));
  const darkCap=globalDarkCoverage>=.28?5:globalDarkCoverage>=.16?4:
    globalDarkCoverage>=.06?3:2;
  const darkFloor=globalDarkCoverage>=.28?3:globalDarkCoverage>=.10?2:
    globalDarkCoverage>=.025?1:0;
  const warmDarkCap=globalDarkCoverage>=.28?3:Math.max(1,darkCap-1);
  const earthyCap=Math.max(3,Math.floor(count*.17));
  const earthyCount=()=>chosen.filter(o=>o.isEarthy).length;
  const darkCount=()=>chosen.filter(isDarkTone).length;
  const warmDarkCount=()=>chosen.filter(isWarmDark).length;
  const canAdd=o=>(!o.isEarthy||earthyCount()<earthyCap)&&
    (!isDarkTone(o)||darkCount()<darkCap)&&
    (!isWarmDark(o)||warmDarkCount()<warmDarkCap);
  const minLabDistance=o=>chosen.length
    ?Math.min(...chosen.map(selected=>labDistance(selected.lab,o.lab)))
    :99;
  const relevance=o=>(o.accentScore||0)*1.05+(o.supportScore||0)*.75+
    (o.score||0)*.28+Math.min(1,Math.sqrt(o.area||0)*5)*.35+
    (o.isPaleChromatic?.28:0)+(o.vivid?.18:0)-
    (o.regional&&(o.area||0)<.00012?.25:0)+
    (isDarkTone(o)&&!o.regional?Math.min(.9,Math.sqrt(o.area||0)*2.5):0)-
    (isDarkTone(o)&&o.regional?.55:0);
  const takeAnchors=(filter,limit,minDistance)=>{
    for(const o of pool.filter(filter).sort((a,b)=>relevance(b)-relevance(a))){
      if(limit<=0||chosen.length>=count)break;
      if(!chosen.includes(o)&&canAdd(o)&&minLabDistance(o)>=minDistance){
        chosen.push(o);limit--;
      }
    }
  };

  takeAnchors(o=>(o.accentScore||0)>=2.4,4,17);
  takeAnchors(o=>o.isPaleChromatic,6,12);
  if(globalDeepDarkCoverage>=.008){
    const deepAnchor=pool.filter(o=>!o.regional&&o.info.br<60&&canAdd(o))
      .sort((a,b)=>
        ((b.supportScore||0)+Math.sqrt(b.area||0)*3)-
        ((a.supportScore||0)+Math.sqrt(a.area||0)*3)
      )[0];
    if(deepAnchor&&!chosen.includes(deepAnchor))chosen.push(deepAnchor);
  }
  // 必要な暗色は、局所タイルではなく面積と連続性を持つ全体クラスタから確保する。
  takeAnchors(o=>isDarkTone(o)&&!o.regional,Math.max(0,darkFloor-darkCount()),10);
  takeAnchors(o=>(o.supportScore||0)>=.55,3,14);

  while(chosen.length<count){
    let best=null,bestScore=-Infinity;
    for(const o of pool){
      if(chosen.includes(o)||!canAdd(o))continue;
      const distance=minLabDistance(o);
      let score=relevance(o)+Math.min(2.8,distance/12*1.25);
      // ほぼ同色は強く抑え、必要になった時だけ段階的に許可する。
      if(distance<5)score-=12;
      else if(distance<8)score-=5;
      else if(distance<12)score-=1.8;
      else if(distance<16)score-=.45;
      const sameToneCount=chosen.filter(selected=>
        hueDiff(selected.info.h,o.info.h)<18&&
        Math.abs(selected.info.light-o.info.light)<24
      ).length;
      score-=Math.max(0,sameToneCount-1)*.55;
      if(isDarkTone(o)){
        const nearestDark=chosen.filter(isDarkTone).reduce((min,selected)=>
          Math.min(min,labDistance(selected.lab,o.lab)),99);
        // 暗色同士は通常色より広い間隔を要求する。同じ黒・焦げ茶の階調だけで
        // 枠を消費せず、色味や明度に意味のある差がある時だけ複数採用する。
        if(nearestDark<7)score-=8;
        else if(nearestDark<11)score-=3.2;
        else if(nearestDark<15)score-=.9;
        if(o.regional)score-=.65;
      }
      if(score>bestScore){best=o;bestScore=score;}
    }
    if(!best)break;
    chosen.push(best);
  }
  return chosen.slice(0,count);
}

function pick3(px, strategy=0) {
  if (!px.length) return [];

  // くすみ・同系色に寄りすぎないように、面積・彩度・明度・色相のバランスで選ぶ
  const sample = px.filter((_, i) => i % 2 === 0); // 1/2サンプリングで小面積色を逃さない
  const centers = kmeans(sample, 32, strategy * 11 + 5); // クラスター数を増やして小面積の鮮やか色も拾う

  const clusterCount = centers.map(c => ({ c, n: 0 }));
  for (const p of sample) {
    let bi = 0, bd = Infinity;
    for (let i = 0; i < centers.length; i++) {
      const d = dist(p, centers[i]);
      if (d < bd) { bd = d; bi = i; }
    }
    clusterCount[bi].n++;
  }

  const total = Math.max(1, sample.length);
  let scored = clusterCount.map(({c,n}) => {
    const info=rgbInfo(c);
    const area=n/total;
    const tooWhite=info.br>242 && info.s<.12;
    const tooBlack=info.br<24;
    const midLight=1-Math.min(1,Math.abs(info.br-150)/150);
    const accentBoost=info.s*3.2 + (info.s>.4?0.9:0) + (info.s>.6?0.6:0); // 高彩度を大きく優遇
    const areaBoost=Math.sqrt(area)*0.55; // 面積の影響を下げる
    const score=accentBoost + areaBoost + midLight*.22 - (tooWhite||tooBlack?1.2:0);
    return {c,area,score,info};
  }).filter(o=>o.area>.0008 || o.info.s>.4).sort((a,b)=>b.score-a.score); // 鮮やかな色は小面積でも残す

  // retryごとに少し観点を変える
  if (strategy % 4 === 1) scored=scored.slice().sort((a,b)=>b.info.s-a.info.s || b.score-a.score);
  if (strategy % 4 === 2) scored=scored.slice().sort((a,b)=>b.area-a.area || b.info.s-a.info.s);
  if (strategy % 4 === 3) scored=scored.slice().sort((a,b)=>Math.abs(150-a.info.br)-Math.abs(150-b.info.br) || b.info.s-a.info.s);

  const selected=[];
  const isTooSimilar=(c)=>selected.some(s=>{
    const a=rgbInfo(c), b=rgbInfo(s);
    return hueDiff(a.h,b.h)<30 && Math.abs(a.light-b.light)<40;
  });

  // まず高彩度アクセントを1色優先
  const accent=scored.find(o=>o.info.s>.35 && o.info.br>45 && o.info.br<240);
  if(accent) selected.push(accent.c);
  // 2色目：1色目と色相が大きく異なる高彩度色を探す（ピンク・ブルーなど多様な色を拾う）
  if(selected.length===1){
    const first=rgbInfo(selected[0]);
    const second=scored.find(o=>{
      if(selected.includes(o.c))return false;
      return o.info.s>.3 && hueDiff(o.info.h,first.h)>60 && o.info.br>45 && o.info.br<240;
    });
    if(second) selected.push(second.c);
  }

  // 次に、色相・明度が被りにくいものを追加
  for (const o of scored) {
    if(selected.length>=3) break;
    if(selected.includes(o.c)) continue;
    if(isTooSimilar(o.c)) continue;
    selected.push(o.c);
  }

  // まだ足りない場合はトーン距離が遠い順に補充
  for (const o of scored) {
    if(selected.length>=3) break;
    if(selected.includes(o.c)) continue;
    const minD=selected.length?Math.min(...selected.map(s=>toneDistance(o.c,s))):999;
    if(minD>28) selected.push(o.c);
  }
  for (const o of scored) { if(selected.length>=3) break; if(!selected.includes(o.c)) selected.push(o.c); }

  // ほんの少しだけ彩度を整える
  return selected.slice(0,3).map(([r,g,b]) => {
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if (mx===0 || mx===mn) return toHex(r,g,b);
    const sat=(mx-mn)/mx;
    const boost=Math.min(1, sat + (sat<.35?.16:.08));
    const scale=boost/sat;
    return toHex(mx-(mx-r)*scale, mx-(mx-g)*scale, mx-(mx-b)*scale);
  });
}

// パレット用に多色を抽出。表示用HEXとは別に、最終3色の採点情報も保持する。
function pickManyDetailed(px, count=30) {
  if (!px.length) return [];

  const total=Math.max(1,px.length);
  const width=px.sampleWidth||Math.max(1,Math.round(Math.sqrt(px.length)));
  const height=px.sampleHeight||Math.max(1,Math.ceil(px.length/width));

  // k-meansの学習だけ1/2サンプリングし、局所評価は全画素で行う。
  const sample = px.filter((_, i) => i % 2 === 0);
  const centers = kmeans(sample, 64, 29);
  const clusters = centers.map(c => ({c,n:0}));
  const labels=new Uint8Array(px.length);
  const borderCount=new Uint32Array(centers.length);
  for(let pi=0;pi<px.length;pi++){
    const p=px[pi];
    let bi=0,bd=Infinity;
    for(let i=0;i<centers.length;i++){
      const d=dist(p,centers[i]);
      if(d<bd){bd=d;bi=i;}
    }
    clusters[bi].n++;
    labels[pi]=bi;
    const x=pi%width,y=Math.floor(pi/width);
    if(x===0||x===width-1||y===0||y===height-1)borderCount[bi]++;
  }

  const centerLabs=centers.map(rgbToLab);
  const boundaryDiff=new Float32Array(centers.length);
  const boundaryCount=new Uint32Array(centers.length);
  const sameEdges=new Uint32Array(centers.length);
  const allEdges=new Uint32Array(centers.length);

  // 右・下の近傍だけを調べ、周囲との差と同系色の連続性を低コストで測る。
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      const at=y*width+x;
      if(at>=labels.length) break;
      const a=labels[at];
      for(const next of [x+1<width?at+1:-1,y+1<height?at+width:-1]){
        if(next<0||next>=labels.length) continue;
        const b=labels[next];
        allEdges[a]++; allEdges[b]++;
        if(a===b){sameEdges[a]+=2;continue;}
        const d=labDistance(centerLabs[a],centerLabs[b]);
        boundaryDiff[a]+=d; boundaryDiff[b]+=d;
        boundaryCount[a]++; boundaryCount[b]++;
      }
    }
  }

  // 最大連結領域を求め、散在する点状ノイズよりまとまったアクセントを優先する。
  const visited=new Uint8Array(labels.length);
  const queue=new Int32Array(labels.length);
  const largest=new Uint32Array(centers.length);
  for(let start=0;start<labels.length;start++){
    if(visited[start]) continue;
    const label=labels[start];
    let head=0,tail=0,size=0;
    queue[tail++]=start; visited[start]=1;
    while(head<tail){
      const at=queue[head++]; size++;
      const x=at%width, y=Math.floor(at/width);
      const neighbors=[x?at-1:-1,x+1<width?at+1:-1,y?at-width:-1,y+1<height?at+width:-1];
      for(const next of neighbors){
        if(next>=0&&next<labels.length&&!visited[next]&&labels[next]===label){
          visited[next]=1; queue[tail++]=next;
        }
      }
    }
    if(size>largest[label]) largest[label]=size;
  }

  let candidates=clusters.map(({c,n},index)=>{
    const info=rgbInfo(c);
    const lab=centerLabs[index];
    const tone=classifyNaturalTone(info,lab);
    const {chroma,isTrueGray,isNearNeutral,isPaleChromatic,pastel}=tone;
    const area=n/total;
    const isDark=info.br<55;
    const isBrown=(info.h<55 || info.h>345) && info.s<.58 && info.br<175;
    const isGray=isTrueGray;
    const vivid=info.s>.48 && info.br>65 && info.br<238;
    const lightColor=info.br>185 && (info.s>.14||isPaleChromatic);
    const largestArea=largest[index]/total;
    const coherence=n?largest[index]/n:0;
    const localContrast=boundaryCount[index]?boundaryDiff[index]/boundaryCount[index]:0;
    const neighborAgreement=allEdges[index]?sameEdges[index]/allEdges[index]:0;
    const noise=largest[index]<Math.max(3,total*.00015);
    const isWhite=info.br>225&&info.s<.18;
    const borderCoverage=borderCount[index]/Math.max(1,width*2+height*2-4);
    const backgroundWhite=isWhite&&area>.07&&borderCoverage>.16;
    const subjectWhite=isWhite&&!backgroundWhite&&localContrast>10&&largestArea>.0003;

    // 面積は参考程度。彩度・明るさ・アクセント性を強く優先。
    let score = info.s*4.2 + Math.sqrt(area)*0.28;
    if(vivid) score += 2.2;
    if(pastel) score += 1.15;
    if(lightColor) score += .65;
    if(subjectWhite) score += .45;
    if(isDark) score -= 2.0;
    if(isNearNeutral) score -= 1.25;
    if(isBrown) score -= .75;

    // 上限で使う「地味系」判定はisBrownより広め（明るいベージュ・くすんだオリーブ・グレー系も含む）
    const isEarthy=!subjectWhite&&(isGray||
      (info.h>=12&&info.h<=78&&info.s<.45&&info.br<220)||
      ((info.h>340||info.h<12)&&info.s<.38&&info.br<175));

    // 淡い色は彩度だけで落とさず、周囲との差・領域のまとまりでアクセントになれる。
    const contrastScore=clamp01(localContrast/42);
    const regionScore=clamp01(Math.sqrt(largestArea)*7);
    const chromaScore=clamp01(chroma/55);
    const accentScore=
      contrastScore*(subjectWhite?1.30:2.25)+
      regionScore*1.35+
      coherence*.70+
      neighborAgreement*.35+
      chromaScore*1.25+
      (pastel?.70:0)+(vivid?.55:0)+(subjectWhite?.20:0)-
      (noise?2.2:0)-(isDark&&isNearNeutral?.75:0);
    const supportScore=
      Math.sqrt(area)*2.4+regionScore*.8+coherence*.35+
      (info.br>65&&info.br<225?.35:0)-(noise?1.5:0);

    return {
      c,info,lab,area,score,hex:toHex(...c),vivid,pastel,
      chroma,isPaleChromatic,isTrueGray,isDark,isNearNeutral,isBrown,isGray,isEarthy,isWhite,backgroundWhite,subjectWhite,
      borderCoverage,localContrast,coherence,largestArea,accentScore,supportScore
    };
  });
  const hasBackgroundWhite=candidates.some(o=>o.backgroundWhite);
  candidates=candidates.filter(o=>o.area>.00025 && o.info.br>18 && o.info.br<255 && !o.backgroundWhite);

  // 小領域の平均も候補化する。全体クラスタでくすむ前の淡い色・透明感のある色を残す。
  const regional=[];
  const tile=Math.max(6,Math.round(Math.max(width,height)/28));
  for(let ty=0;ty<height;ty+=tile)for(let tx=0;tx<width;tx+=tile){
    let sr=0,sg=0,sb=0,n=0;
    const toneBins=new Map();
    const xEnd=Math.min(width,tx+tile),yEnd=Math.min(height,ty+tile);
    for(let y=ty;y<yEnd;y++)for(let x=tx;x<xEnd;x++){
      const p=px[y*width+x];if(!p)continue;
      sr+=p[0];sg+=p[1];sb+=p[2];n++;
      const key=((p[0]>>4)<<8)|((p[1]>>4)<<4)|(p[2]>>4);
      const bin=toneBins.get(key)||{n:0,r:0,g:0,b:0};
      bin.n++;bin.r+=p[0];bin.g+=p[1];bin.b+=p[2];toneBins.set(key,bin);
    }
    if(n<9)continue;
    const mean=[Math.round(sr/n),Math.round(sg/n),Math.round(sb/n)];
    let representative=null,representativeScore=-Infinity;
    for(const bin of toneBins.values()){
      if(bin.n<3)continue; // 単独ピクセルや小さなノイズは候補にしない
      const bc=[bin.r/bin.n,bin.g/bin.n,bin.b/bin.n];
      const bi=rgbInfo(bc),bl=rgbToLab(bc);
      const chroma=Math.hypot(bl[1],bl[2]);
      const lightChromatic=bi.br>155&&bi.br<249&&bi.s>.07&&chroma>6;
      const bs=Math.sqrt(bin.n)*1.6+bi.s*2.0+(lightChromatic?2.0:0)+(bi.br>175?0.35:0);
      if(bs>representativeScore){representativeScore=bs;representative={c:bc,n:bin.n};}
    }
    // 全体平均とは別に、領域内で実際に複数存在する明るい色を代表にする。
    const c=(representative?.c||mean).map(Math.round);
    const candidatePixels=representative?.n||n;
    const info=rgbInfo(c),lab=rgbToLab(c),area=candidatePixels/total;
    let rr=0,rg=0,rb=0,rn=0;
    const ring=Math.max(2,Math.round(tile*.35));
    for(let y=Math.max(0,ty-ring);y<Math.min(height,yEnd+ring);y++){
      for(let x=Math.max(0,tx-ring);x<Math.min(width,xEnd+ring);x++){
        if(x>=tx&&x<xEnd&&y>=ty&&y<yEnd)continue;
        const p=px[y*width+x];if(!p)continue;
        rr+=p[0];rg+=p[1];rb+=p[2];rn++;
      }
    }
    const localContrast=rn?labDistance(lab,rgbToLab([rr/rn,rg/rn,rb/rn])):0;
    const tone=classifyNaturalTone(info,lab);
    const {chroma,isTrueGray,isNearNeutral,isPaleChromatic,pastel}=tone;
    const vivid=info.s>.45&&info.br>60&&info.br<242;
    const isBrown=(info.h<55||info.h>345)&&info.s<.58&&info.br<175;
    const isGray=isTrueGray;
    const isWhite=info.br>225&&info.s<.18;
    const touchesBorder=tx===0||ty===0||xEnd===width||yEnd===height;
    const backgroundWhite=isWhite&&(hasBackgroundWhite||(touchesBorder&&localContrast<13));
    const subjectWhite=isWhite&&!backgroundWhite&&localContrast>10;
    const isEarthy=!subjectWhite&&(isGray||
      (info.h>=12&&info.h<=78&&info.s<.45&&info.br<220)||
      ((info.h>340||info.h<12)&&info.s<.38&&info.br<175));
    const contrastScore=clamp01(localContrast/38);
    const chromaScore=clamp01(chroma/48);
    const regionScore=clamp01(Math.sqrt(area)*7);
    const accentScore=contrastScore*(subjectWhite?1.25:2.65)+chromaScore*1.35+regionScore*1.0+
      (pastel?.85:0)+(vivid?.55:0)+(subjectWhite?.20:0)-(isBrown?.25:0);
    const supportScore=Math.sqrt(area)*1.8+regionScore*.65+(info.br>55&&info.br<235?.25:0);
    let score=accentScore+info.s*1.2+(pastel?.8:0)+(vivid?.6:0)-(isBrown?.45:0);
    if(backgroundWhite||info.br<=18||info.br>=255||(!pastel&&!vivid&&!subjectWhite&&localContrast<8))continue;
    regional.push({
      c,info,lab,area,score,hex:toHex(...c),vivid,pastel,isDark:info.br<55,
      chroma,isPaleChromatic,isTrueGray,isNearNeutral,isBrown,isGray,isEarthy,isWhite,backgroundWhite,subjectWhite,
      borderCoverage:touchesBorder?1:0,localContrast,coherence:1,largestArea:area,
      accentScore,supportScore,regional:true
    });
  }
  candidates.push(...regional);
  return selectNaturalDiverseCandidates(candidates,count);
}

function pickMany(px,count=30){
  return pickManyDetailed(px,count).map(o=>o.hex);
}

function candidateFromHex(hex,index=0){
  const c=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
  const info=rgbInfo(c),lab=rgbToLab(c);
  const tone=classifyNaturalTone(info,lab);
  const {chroma,isTrueGray,isNearNeutral,isPaleChromatic,pastel}=tone;
  const isBrown=(info.h<55||info.h>345)&&info.s<.58&&info.br<175;
  const isGray=isTrueGray;
  return {
    hex,c,lab,info,index,area:0,largestArea:0,localContrast:0,coherence:0,
    chroma,isPaleChromatic,isTrueGray,pastel,isBrown,isGray,isEarthy:isGray||
      (info.h>=12&&info.h<=78&&info.s<.45&&info.br<220)||
      ((info.h>340||info.h<12)&&info.s<.38&&info.br<175),
    isDark:info.br<55,isNearNeutral,
    accentScore:info.s*2+(pastel?.5:0),supportScore:0
  };
}

const PALETTE_SET_RANK_CACHE=new WeakMap();

// 1色ずつ決めず、最大30色から3色の全組み合わせをセットとして採点する。
function rankPaletteSets(source){
  const cached=PALETTE_SET_RANK_CACHE.get(source);
  if(cached)return cached;
  const items=source.map((value,index)=>
    typeof value==='string'?candidateFromHex(value,index):{index,...value}
  );
  const ranked=[];
  for(let i=0;i<items.length-2;i++) for(let j=i+1;j<items.length-1;j++) for(let k=j+1;k<items.length;k++){
    const set=[items[i],items[j],items[k]];
    const accents=set.map(o=>o.accentScore||0).sort((a,b)=>b-a);
    const supports=set.map(o=>o.supportScore||0).sort((a,b)=>b-a);
    const earthyCount=set.filter(o=>o.isEarthy).length;
    const chromaticCount=set.filter(o=>!o.isEarthy&&o.info.s>.18).length;
    const darkQuietCount=set.filter(o=>o.info.br<100&&(o.accentScore||0)<2.5).length;
    const distances=[
      labDistance(set[0].lab,set[1].lab),
      labDistance(set[0].lab,set[2].lab),
      labDistance(set[1].lab,set[2].lab)
    ];
    const minDistance=Math.min(...distances);
    const avgDistance=distances.reduce((a,b)=>a+b,0)/3;
    const lightRange=Math.max(...set.map(o=>o.info.light))-Math.min(...set.map(o=>o.info.light));
    const satRange=Math.max(...set.map(o=>o.info.s))-Math.min(...set.map(o=>o.info.s));
    let duplicatePenalty=0;
    for(let p=0;p<3;p++) for(let q=p+1;q<3;q++){
      const a=set[p],b=set[q],d=labDistance(a.lab,b.lab);
      if(d<10) duplicatePenalty+=5;
      else if(d<16) duplicatePenalty+=2.2;
      else if(d<32&&hueDiff(a.info.h,b.info.h)<28&&
        Math.abs(a.info.light-b.info.light)<42&&Math.abs(a.info.s-b.info.s)<.28) duplicatePenalty+=1.05;
      else if(d<45&&hueDiff(a.info.h,b.info.h)<28) duplicatePenalty+=.30;
      if(hueDiff(a.info.h,b.info.h)<24)duplicatePenalty+=.85;
      // 同系色は明度・彩度差があれば許可し、似た茶・ベージュだけを強く抑える。
      if(a.isEarthy&&b.isEarthy&&(d<28||hueDiff(a.info.h,b.info.h)<24)) duplicatePenalty+=3.4;
    }

    // アクセント2色＋支え色1色を基本としつつ、面積のある支え色2色も得点可能。
    let score=
      accents[0]*2.0+accents[1]*1.35+accents[2]*.25+
      supports[0]*.85+supports[1]*.35+
      Math.min(1,minDistance/30)*1.45+
      Math.min(1,avgDistance/58)*.75+
      Math.min(1,lightRange/70)*.55+
      Math.min(1,satRange/.48)*.30+
      chromaticCount*.35-
      duplicatePenalty-
      earthyCount*.45-
      Math.max(0,earthyCount-1)*3.2-
      darkQuietCount*1.6;
    if(accents[0]<1.8) score-=3.5; // アクセント候補を最低1色含める
    ranked.push({set,score});
  }
  ranked.sort((a,b)=>b.score-a.score);
  PALETTE_SET_RANK_CACHE.set(source,ranked);
  return ranked;
}

function pickDiverse3(source,start=0){
  if(!source.length)return[];
  if(source.length<3)return source.map(o=>typeof o==='string'?o:o.hex);
  const ranked=rankPaletteSets(source);
  // おまかせは上位候補を順に切り替える。初回は常に最高得点セット。
  const poolSize=Math.min(60,ranked.length);
  const picked=ranked[((start%poolSize)+poolSize)%poolSize]?.set||[];
  return picked
    .slice()
    .sort((a,b)=>(b.accentScore||0)-(a.accentScore||0))
    .map(o=>o.hex);
}


// 写真のピクセルから「主役色・明るい色・支え色」を直接選ぶ。
// パレット配列の並び順に依存しないため、おまかせを押すたびに候補がきちんと変わる。
function pickAuto3FromPixels(px, strategy=0) {
  if (!px.length) return [];
  const sample=px.filter((_,i)=>i%2===0);
  const centers=kmeans(sample,56,strategy*19+7);
  const clusters=centers.map(c=>({c,n:0}));
  for(const p of sample){
    let bi=0,bd=Infinity;
    for(let i=0;i<centers.length;i++){
      const d=dist(p,centers[i]);
      if(d<bd){bd=d;bi=i;}
    }
    clusters[bi].n++;
  }
  const total=Math.max(1,sample.length);
  const candidates=clusters.map(({c,n})=>{
    const info=rgbInfo(c), area=n/total;
    const neutral=info.s<.11;
    const dark=info.br<42;
    const nearWhite=info.br>246&&info.s<.10;
    const brown=(info.h<55||info.h>345)&&info.s<.48&&info.br<175;
    return {c,info,area,neutral,dark,nearWhite,brown,hex:toHex(...c)};
  }).filter(o=>o.area>.00035&&!o.nearWhite&&o.info.br>20&&o.info.br<248);

  if(!candidates.length) return pick3(px,strategy);
  const mode=((strategy%4)+4)%4; // balanced / vivid / light / dominant
  const variant=Math.floor(strategy/4)%4;
  const selected=[];
  const isClose=(a,b)=>hueDiff(a.info.h,b.info.h)<22&&Math.abs(a.info.light-b.info.light)<34;
  const addRanked=(pool,scoreFn,rankOffset=0,minHue=0)=>{
    const ranked=pool.filter(o=>!selected.some(s=>s.hex===o.hex))
      .filter(o=>!selected.some(s=>isClose(s,o)))
      .filter(o=>!selected.length||selected.every(s=>hueDiff(s.info.h,o.info.h)>=minHue))
      .sort((a,b)=>scoreFn(b)-scoreFn(a));
    if(!ranked.length) return false;
    const idx=Math.min((variant+rankOffset)%Math.min(4,ranked.length),ranked.length-1);
    selected.push(ranked[idx]);
    return true;
  };

  const chromatic=candidates.filter(o=>o.info.s>.22&&!o.dark);
  const vivid=candidates.filter(o=>o.info.s>.42&&o.info.br>58&&o.info.br<240);
  const light=candidates.filter(o=>o.info.br>170&&o.info.s>.13&&!o.nearWhite);
  const usable=candidates.filter(o=>!o.dark&&o.info.br<242);

  // 1色目：モード別の主役色
  if(mode===1){
    addRanked(vivid,o=>o.info.s*4.8+Math.sqrt(o.area)*.7+o.info.br*.003,0,0);
  }else if(mode===2){
    addRanked(light,o=>o.info.br*.018+o.info.s*2.4+Math.sqrt(o.area)*.5,0,0);
  }else if(mode===3){
    addRanked(usable,o=>Math.sqrt(o.area)*4+o.info.s*1.25-(o.neutral?1.2:0)-(o.brown?.25:0),0,0);
  }else{
    addRanked(chromatic,o=>o.info.s*3.25+Math.sqrt(o.area)*1.25+(o.info.br>105?0.55:0)-(o.brown?.35:0),0,0);
  }

  // 2色目：一色目とはっきり違う、明るい色またはアクセント色
  const contrastPool=[...light,...vivid,...chromatic];
  addRanked(contrastPool,o=>{
    const first=selected[0];
    const hd=first?hueDiff(first.info.h,o.info.h):0;
    return hd*0.035+o.info.s*2.6+o.info.br*.007+Math.sqrt(o.area)*.45;
  },1,38);

  // 3色目：写真の面積も考慮した支え色。暗色・無彩色だけになるのは避ける
  addRanked(usable,o=>{
    const separation=selected.length?Math.min(...selected.map(s=>toneDistance(s.c,o.c))):0;
    return separation*.025+Math.sqrt(o.area)*2.1+o.info.s*1.35+(o.info.br>115?0.45:0)-(o.dark?2:0)-(o.neutral?.6:0);
  },2,18);

  // 条件が厳しくて足りない場合のみ緩めて補う
  for(const pool of [vivid,light,chromatic,usable,candidates]){
    for(const o of pool){
      if(selected.length>=3) break;
      if(!selected.some(s=>s.hex===o.hex)&&!selected.some(s=>isClose(s,o))) selected.push(o);
    }
    if(selected.length>=3) break;
  }
  for(const o of candidates){
    if(selected.length>=3) break;
    if(!selected.some(s=>s.hex===o.hex)) selected.push(o);
  }
  return selected.slice(0,3).map(o=>o.hex);
}

function colorName(hex, usedNames=null) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const br=getBr([r,g,b]), sat=getSat([r,g,b]);
  const h=Math.round(getHue([r,g,b])*360);

  // ハイブリッド・ネーミング：
  // 1. 各色域に豊富な候補リスト
  // 2. hex値から決定的にインデックスを選ぶ（同じ色→同じ名前、微妙に違う色→違う名前）
  // 3. 被ったら次候補→それでも被れば形容詞を自動付与
  const seed=(r*7+g*13+b*17)%97; // hexから決定的な数値
  const pick=(list)=>{
    const clean=list.map(n=>String(n).toUpperCase());
    const start=seed%clean.length;
    if(!usedNames) return clean[start];
    // startから順に空いてる名前を探す
    for(let i=0;i<clean.length;i++){
      const n=clean[(start+i)%clean.length];
      if(!usedNames.has(n)){ usedNames.add(n); return n; }
    }
    // 全部使われてたら形容詞を付けて自動生成
    const tone = br<75?'DEEP' : br>205?'PALE' : sat<.25?'DUSTY' : 'SOFT';
    let name=`${tone} ${clean[start]}`;
    let i=2;
    while(usedNames.has(name)){ name=`${tone} ${clean[start]} ${i++}`; }
    usedNames.add(name);
    return name;
  };

  if (sat < .08) {
    if (br > 232) return pick(['IVORY','MILK','CLOUD','PEARL','SNOW','CHALK','COTTON','PAPER']);
    if (br > 175) return pick(['MIST','FOG','ASH','DOVE','SILVER','PEBBLE','MOON','FEATHER']);
    if (br > 95) return pick(['STONE','SMOKE','TAUPE','GREIGE','CEMENT','FLINT','SHADOW','PUTTY']);
    return pick(['INK','CHARCOAL','NOIR','GRAPHITE','ONYX','SOOT','RAVEN','COAL']);
  }

  // red / pink
  if (h >= 338 || h < 12) {
    if (sat > .58 && br > 130) return pick(['BERRY','RASPBERRY','CHERRY','POPPY','STRAWBERRY','RUBY','PUNCH','CRANBERRY']);
    if (br > 205) return pick(['BLUSH','PETAL','SAKURA','COTTON CANDY','BABY PINK','SHELL','ROSEWATER','PEONY']);
    if (br > 145) return pick(['ROSE','CORAL','DUSTY ROSE','FLAMINGO','SALMON','TEA ROSE','CAMELLIA','ROUGE']);
    return pick(['CRIMSON','WINE','CHERRY','BURGUNDY','GARNET','MERLOT','BRICK RED','SANGRIA']);
  }

  // coral / terracotta / rust
  if (h < 28) {
    if (sat > .62 && br > 145) return pick(['CORAL','FLAMINGO','POPPY','APRICOT','TANGERINE','PERSIMMON','PAPAYA','SUNSET']);
    if (br > 190) return pick(['PEACH','APRICOT','MELON','CANTALOUPE','NECTAR','SHERBET','CREAMSICLE','BISQUE']);
    if (br < 75) return pick(['ESPRESSO','COCOA','WALNUT','CACAO','MAHOGANY','CHESTNUT','UMBER','TRUFFLE']);
    if (br < 120) return pick(['RUST','CLAY','CINNAMON','BRICK','AUBURN','SIENNA','PAPRIKA','GINGER']);
    return pick(['TERRACOTTA','CINNAMON','CLAY','RUST','ADOBE','CANYON','SPICE','AMBER CLAY']);
  }

  // orange / brown / beige
  if (h < 52) {
    if (br > 210) return pick(['CREAM','BUTTER','VANILLA','OAT','CUSTARD','ALMOND MILK','ECRU','LINEN']);
    if (sat < .30 && br > 165) return pick(['LATTE','BISCUIT','OAT','SAND','ALMOND','BEIGE','TOAST','MUSHROOM']);
    if (br > 145) return pick(['CARAMEL','HONEY','BISCUIT','BUTTERSCOTCH','MAPLE','TOFFEE','GOLDEN','APRICOT JAM']);
    if (br > 95) return pick(['WALNUT','MOCHA','COCOA','CINNAMON','PECAN','HAZELNUT','BRONZE','TAWNY']);
    return pick(['ESPRESSO','CACAO','COFFEE','DARK CHOCOLATE','MAHOGANY','TRUFFLE','UMBER','MOLE']);
  }

  // yellow
  if (h < 76) {
    if (sat > .55) return pick(['GOLD','MARIGOLD','SAFFRON','SUNSHINE','MUSTARD','AMBER','DIJON','GOLDENROD']);
    if (br > 210) return pick(['LEMON','BUTTER','CREAM','VANILLA','CHIFFON','DAFFODIL','BANANA','CUSTARD']);
    if (sat > .45) return pick(['HONEY','MUSTARD','GOLD','AMBER','SAFFRON','MARIGOLD','OCHRE','DIJON']);
    return pick(['SAND','OAT','WHEAT','KHAKI','STRAW','FLAX','DUNE','RATTAN']);
  }

  // green
  if (h < 165) {
    if (br > 205 && sat < .45) return pick(['MINT','SAGE','PISTACHIO','CELERY','HONEYDEW','SEAFOAM','CUCUMBER','MATCHA LATTE']);
    if (br > 180) return pick(['SAGE','MINT','FERN','PISTACHIO','MATCHA','JADE','WILLOW','APPLE']);
    if (sat > .45 && br > 120) return pick(['OLIVE','FERN','HERB','LEAF','BASIL','CLOVER','MEADOW','KALE']);
    if (br > 95) return pick(['MOSS','OLIVE','FOREST','SAGE','JUNIPER','THYME','ARTICHOKE','LICHEN']);
    return pick(['FOREST','PINE','MOSS','EVERGREEN','HUNTER','SPRUCE','SEAWEED','BOTTLE GREEN']);
  }

  // blue / cyan
  if (h < 255) {
    if (br > 218) return pick(['ICE','POWDER','CLOUD','MIST','ARCTIC','FROST','GLACIER','BABY BLUE']);
    if (br > 185) return pick(['SKY','ICE','MIST','POWDER','CORNFLOWER','PERIWINKLE','AQUA','ROBIN EGG']);
    if (sat < .35 && br > 125) return pick(['DENIM','SLATE','DUSK','STEEL','STORM','HARBOR','PEWTER','RAIN']);
    if (br > 95) return pick(['BLUE','OCEAN','DENIM','COBALT','LAGOON','MARINE','CERULEAN','TEAL BLUE']);
    return pick(['NAVY','INDIGO','MIDNIGHT','INK','SAPPHIRE','DEEP SEA','TWILIGHT','ABYSS']);
  }

  // purple
  if (h < 305) {
    if (br > 210) return pick(['LILAC','LAVENDER','VIOLET','WISTERIA','THISTLE','PERIWINKLE','HEATHER','SWEET PEA']);
    if (br > 170) return pick(['LAVENDER','LILAC','MAUVE','VIOLET','AMETHYST','IRIS','CROCUS','HYACINTH']);
    if (sat < .42) return pick(['MAUVE','PLUM','TAUPE','ORCHID GRAY','SMOKY PLUM','FIG','ELDERBERRY','DUSK PURPLE']);
    return pick(['PLUM','VIOLET','GRAPE','ORCHID','AMETHYST','EGGPLANT','MULBERRY','ROYAL PURPLE']);
  }

  // magenta / pink-purple
  if (sat > .55 && br > 135) return pick(['BERRY','MAGENTA','FUCHSIA','ORCHID PINK','AZALEA','BOUGAINVILLEA','PITAYA','HOT PINK']);
  if (br > 205) return pick(['BLUSH','PETAL','LILAC PINK','SAKURA','SWEET LILAC','FAIRY','CANDY','BALLET']);
  if (br > 150) return pick(['ROSE','MAUVE','BERRY','DUSTY ROSE','ORCHID','RASPBERRY MILK','TEA ROSE','MALLOW']);
  return pick(['MAUVE','PLUM','WINE','BERRY','MULBERRY','FIG','BORDEAUX','RAISIN']);
}

// CANVAS CARD RENDERERS
// ─────────────────────────────────────────────
const INK='#667A8C', CARD_BG='#FAFAF8';
const CARD_FONT = "'Helvetica Neue', Arial, 'Noto Sans JP', sans-serif";

function drawMinimalChip(ctx, x, y, colors) {
  // Minimal Chip v5:
  // ・HEXが絶対に重ならないよう、1色ごとのカラム幅を固定
  // ・フォントは全カード共通のサンセリフ（Helvetica Neue / Arial / Noto Sans JP）
  // ・角丸なし
  // ・文字が長い場合は自動で少しだけ縮小
  const CS = 36;
  const COL_W = 70;
  const PD_X = 12;
  const PD_Y = 11;
  const LABEL_GAP = 10;
  const LABEL_H = 16;
  const BOTTOM = 11;
  const W = COL_W * 3 + PD_X * 2;
  const H = PD_Y + CS + LABEL_GAP + LABEL_H + BOTTOM;
  const rx = Math.round(x), ry = Math.round(y);

  ctx.save();
  ctx.shadowColor = 'rgba(75,55,92,.12)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = CARD_BG;
  ctx.fillRect(rx, ry, W, H);
  ctx.restore();

  ctx.strokeStyle = 'rgba(61,68,88,.10)';
  ctx.lineWidth = 1;
  ctx.strokeRect(rx + .5, ry + .5, W - 1, H - 1);

  const drawFitText = (text, cx, y, maxW) => {
    let fs = 10.5;
    ctx.font = `800 ${fs}px ${CARD_FONT}`;
    while (ctx.measureText(text).width > maxW && fs > 8.5) {
      fs -= .5;
      ctx.font = `800 ${fs}px ${CARD_FONT}`;
    }
    ctx.fillText(text, cx, y);
  };

  colors.forEach((hex, i) => {
    const colX = rx + PD_X + i * COL_W;
    const cx = Math.round(colX + COL_W / 2);
    const chipX = Math.round(cx - CS / 2);
    const chipY = Math.round(ry + PD_Y);

    ctx.fillStyle = hex;
    ctx.fillRect(chipX, chipY, CS, CS);
    ctx.strokeStyle = 'rgba(0,0,0,.08)';
    ctx.lineWidth = .8;
    ctx.strokeRect(chipX + .5, chipY + .5, CS - 1, CS - 1);

    ctx.fillStyle = '#3D4458';
    ctx.globalAlpha = .98;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    drawFitText(hex.toUpperCase(), cx, chipY + CS + LABEL_GAP + 10, COL_W - 8);
    ctx.globalAlpha = 1;
  });
}
function fitLabelText(text, maxChars=9) {
  if (!text) return [''];
  if (text.length <= maxChars) return [text];
  if (text.includes(' ')) {
    const parts=text.split(' ');
    return [parts[0].slice(0,maxChars), parts.slice(1).join(' ').slice(0,maxChars)];
  }
  return [text.slice(0, maxChars), text.slice(maxChars, maxChars*2)];
}

function drawPantoneCard(ctx, x, y, colors) {
  const CW=62,CH=84,GAP=6;
  const colorH=Math.round(CH*0.60), labelH=CH-colorH;
  const fitName=(name)=>{
    if(name.length<=8) return [name];
    // スペースがあれば2行に分割
    if(name.includes(' ')){
      const parts=name.split(' ');
      if(parts.length===2) return parts;
      // 3語以上は前半・後半に分ける
      const mid=Math.ceil(parts.length/2);
      return [parts.slice(0,mid).join(' '),parts.slice(mid).join(' ')];
    }
    // 長い1語は半分に分割
    const half=Math.ceil(name.length/2);
    return [name.slice(0,half),name.slice(half)];
  };
  const usedNames=new Set();
  const names=colors.map(hex=>colorName(hex,usedNames));
  colors.forEach((hex,i)=>{
    const cx=Math.round(x+i*(CW+GAP)),cy=Math.round(y);
    ctx.save();ctx.shadowColor='rgba(75,55,92,.14)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
    ctx.fillStyle=CARD_BG;ctx.fillRect(cx,cy,CW,CH);ctx.restore();
    // 色エリアを内側に入れて白いカードの縁を見せる
    const M=3.5; // 白縁の幅
    ctx.fillStyle=hex;ctx.fillRect(cx+M,cy+M,CW-M*2,colorH-M);
    ctx.strokeStyle='rgba(61,68,88,.10)';ctx.lineWidth=.6;ctx.strokeRect(cx,cy,CW,CH);

    const lines=fitName(names[i]);
    ctx.fillStyle=INK;ctx.font=`800 7.4px ${CARD_FONT}`;
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    lines.slice(0,2).forEach((line,li)=>ctx.fillText(line,cx+5,cy+colorH+9+li*7.5));

    ctx.fillStyle=INK;ctx.globalAlpha=.98;ctx.font=`800 8px ${CARD_FONT}`;
    ctx.fillText(hex.toUpperCase(),cx+5,cy+CH-5);
    ctx.globalAlpha=1;
  });
}

function drawSlimLabel(ctx, x, y, colors) {
  const SW=15,PD=9,rowH=24,W=178,H=rowH*3+PD*2;
  ctx.save();ctx.shadowColor='rgba(75,55,92,.14)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
  ctx.fillStyle=CARD_BG;ctx.fillRect(x,y,W,H);ctx.restore();
  ctx.strokeStyle='rgba(61,68,88,.10)';ctx.lineWidth=.6;ctx.strokeRect(x,y,W,H);
  const usedNames=new Set();
  const names=colors.map(hex=>colorName(hex,usedNames));
  colors.forEach((hex,i)=>{
    const ry=Math.round(y+PD+i*rowH);
    ctx.fillStyle=hex;ctx.fillRect(x+PD,ry+4,SW,SW);
    ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=.5;ctx.strokeRect(x+PD,ry+4,SW,SW);
    ctx.fillStyle=INK;ctx.font=`800 6.7px ${CARD_FONT}`;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    const nm=names[i];
    // 長い名前は自動でフォント縮小（切り捨てない）
    let nfs=6.7;
    ctx.font=`800 ${nfs}px ${CARD_FONT}`;
    const maxNameW=W-PD*2-SW-7-58; // HEX表示分を除いた幅
    while(ctx.measureText(nm).width>maxNameW && nfs>5.2){nfs-=.3;ctx.font=`800 ${nfs}px ${CARD_FONT}`;}
    ctx.fillText(nm,Math.round(x+PD+SW+7),ry+14);
    ctx.globalAlpha=.98;ctx.font=`800 7.2px ${CARD_FONT}`;ctx.textAlign='right';
    ctx.fillText(hex.toUpperCase(),x+W-PD,ry+14);ctx.globalAlpha=1;
  });
}

function measureFreeText(ft){
  const c=document.createElement('canvas');
  const cx=c.getContext('2d');
  const fw=ft.bold?700:400;
  cx.font=`${fw} ${ft.size||28}px ${ft.font||"'Playfair Display', serif"}`;
  cx.textBaseline='middle';
  const metrics=cx.measureText(ft.text||'');
  const w=metrics.width;
  const h=(ft.size||28)*1.2;
  const ascent=Number(metrics.actualBoundingBoxAscent);
  const descent=Number(metrics.actualBoundingBoxDescent);
  let visualCenterOffsetY=0;
  if(Number.isFinite(ascent)&&Number.isFinite(descent)&&ascent+descent>0){
    const rawOffset=(descent-ascent)/2;
    const limit=(ft.size||28)*.25;
    visualCenterOffsetY=Math.max(-limit,Math.min(limit,rawOffset));
  }
  return {w,h,visualCenterOffsetY};
}
const TEXT_GESTURE_TOUCH_PADDING_PX=34;
const TEXT_GESTURE_MIN_TARGET_PX=116;
const TEXT_GESTURE_MAX_SPREAD_PX=200;
function hitFreeText(freeTexts,x,y,padding=24){
  for(let i=freeTexts.length-1;i>=0;i--){
    const ft=freeTexts[i];
    if(!ft.text||!ft.text.trim())continue;
    const {w,h}=measureFreeText(ft);
    const hw=w/2+padding, hh=h/2+padding; // 通常タップは指先分を広げ、2本指の対象判定は実表示範囲に近づける
    const rad=-(ft.rotation||0)*Math.PI/180;
    const dx=x-ft.x,dy=y-ft.y;
    const localX=dx*Math.cos(rad)-dy*Math.sin(rad);
    const localY=dx*Math.sin(rad)+dy*Math.cos(rad);
    if(Math.abs(localX)<=hw&&Math.abs(localY)<=hh) return ft.id;
  }
  return null;
}
function hitFreeTextGesture(freeTexts,x,y,storyUnitsPerCssPixel){
  const padding=TEXT_GESTURE_TOUCH_PADDING_PX*storyUnitsPerCssPixel;
  const minHalf=(TEXT_GESTURE_MIN_TARGET_PX/2)*storyUnitsPerCssPixel;
  for(let i=freeTexts.length-1;i>=0;i--){
    const ft=freeTexts[i];
    if(!ft.text||!ft.text.trim())continue;
    const {w,h}=measureFreeText(ft);
    // 小さい文字でも普通のピンチ幅を受け止められる最小タッチ領域を確保する。
    // 長い文字では、実際の選択枠＋全周34pxの余白をそのまま使用する。
    const hw=Math.max(w/2+padding,minHalf);
    const hh=Math.max(h/2+padding,minHalf);
    const rad=-(ft.rotation||0)*Math.PI/180;
    const dx=x-ft.x,dy=y-ft.y;
    const localX=dx*Math.cos(rad)-dy*Math.sin(rad);
    const localY=dx*Math.sin(rad)+dy*Math.cos(rad);
    if(Math.abs(localX)<=hw&&Math.abs(localY)<=hh)return ft.id;
  }
  return null;
}
function normalizeAngleDelta(radians){
  return Math.atan2(Math.sin(radians),Math.cos(radians));
}
const TEXT_ROTATION_SNAP_ENTER_DEG=2.5;
const TEXT_ROTATION_SNAP_EXIT_DEG=3.5;
function normalizeDegrees(degrees){
  return ((degrees+180)%360+360)%360-180;
}
function orderedGestureTouches(touches,gesture){
  const list=[...touches];
  if(list.length!==2||gesture.touchIdA==null||gesture.touchIdB==null)return list;
  const a=list.find(t=>t.identifier===gesture.touchIdA);
  const b=list.find(t=>t.identifier===gesture.touchIdB);
  return a&&b?[a,b]:list;
}

function getCardDims(style) {
  if(style==='minimal') return{w:70*3+12*2,h:11+36+10+16+11}; // drawMinimalChipの実寸(COL_W*3+PD_X*2, PD_Y+CS+LABEL_GAP+LABEL_H+BOTTOM)と一致させる
  if(style==='pantone') return{w:62*3+6*2,h:84};
  return{w:178,h:24*3+9*2};
}

function wrapText(ctx, text, maxW) {
  const chars=text.split(''),lines=[]; let cur='';
  for(const c of chars){
    if(c==='\n'){lines.push(cur);cur='';continue;}
    const t=cur+c;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=c;}else cur=t;
  }
  if(cur)lines.push(cur);return lines;
}

const GALLERY_DB_NAME='palette-story';
const GALLERY_DB_VERSION=1;
const GALLERY_PROJECTS_STORE='projects';
const GALLERY_ASSETS_STORE='assets';
const GALLERY_META_STORE='meta';
const LEGACY_GALLERY_KEY='ps_gallery';
const LEGACY_MIGRATION_KEY='legacy-localstorage-v1';

function idbRequest(request){
  return new Promise((resolve,reject)=>{
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('IndexedDB request failed'));
  });
}

function idbTransactionDone(tx){
  return new Promise((resolve,reject)=>{
    tx.oncomplete=()=>resolve();
    tx.onabort=()=>reject(tx.error||new Error('IndexedDB transaction aborted'));
    tx.onerror=()=>reject(tx.error||new Error('IndexedDB transaction failed'));
  });
}

function openGalleryDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){
      reject(new Error('IndexedDB is not available'));
      return;
    }
    const request=indexedDB.open(GALLERY_DB_NAME,GALLERY_DB_VERSION);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains(GALLERY_PROJECTS_STORE)){
        db.createObjectStore(GALLERY_PROJECTS_STORE,{keyPath:'id'});
      }
      if(!db.objectStoreNames.contains(GALLERY_ASSETS_STORE)){
        const assets=db.createObjectStore(GALLERY_ASSETS_STORE,{keyPath:'id'});
        assets.createIndex('projectId','projectId',{unique:false});
      }
      if(!db.objectStoreNames.contains(GALLERY_META_STORE)){
        db.createObjectStore(GALLERY_META_STORE,{keyPath:'key'});
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('IndexedDB could not be opened'));
    request.onblocked=()=>reject(new Error('IndexedDB upgrade was blocked'));
  });
}

async function resourceToBlob(src){
  if(!src) return null;
  const response=await fetch(src);
  if(!response.ok) throw new Error('Image data could not be read');
  return response.blob();
}

function projectRecordFromEntry(entry,position){
  const editState=entry.editState||null;
  let storedEditState=editState;
  if(editState){
    const {imageSrc,...withoutImage}=editState;
    storedEditState=withoutImage;
  }
  return {
    id:entry.id,
    date:entry.date,
    createdAt:entry.createdAt||entry.id||Date.now(),
    updatedAt:entry.updatedAt||Date.now(),
    position,
    schemaVersion:1,
    editState:storedEditState,
  };
}

async function assetsFromEntry(entry,{preserveSource=false}={}){
  const sourceSrc=entry.editState?.imageSrc||null;
  const [sourceBlob,thumbnailBlob]=await Promise.all([
    preserveSource?Promise.resolve(null):resourceToBlob(sourceSrc),
    resourceToBlob(entry.thumbUrl),
  ]);
  return {
    source:sourceBlob?{id:`${entry.id}:source`,projectId:entry.id,type:'source',blob:sourceBlob}:null,
    thumbnail:thumbnailBlob?{id:`${entry.id}:thumbnail`,projectId:entry.id,type:'thumbnail',blob:thumbnailBlob}:null,
  };
}

async function persistGallerySnapshot(entries,changedEntry=null,removedIds=[],options={}){
  const preparedAssets=changedEntry?await assetsFromEntry(changedEntry,options):null;
  const db=await openGalleryDB();
  try{
    const tx=db.transaction([GALLERY_PROJECTS_STORE,GALLERY_ASSETS_STORE],'readwrite');
    const done=idbTransactionDone(tx);
    const projects=tx.objectStore(GALLERY_PROJECTS_STORE);
    const assets=tx.objectStore(GALLERY_ASSETS_STORE);
    entries.forEach((entry,index)=>projects.put(projectRecordFromEntry(entry,index)));
    if(preparedAssets?.source) assets.put(preparedAssets.source);
    if(preparedAssets?.thumbnail) assets.put(preparedAssets.thumbnail);
    removedIds.forEach(id=>{
      projects.delete(id);
      assets.delete(`${id}:source`);
      assets.delete(`${id}:thumbnail`);
    });
    await done;
  }finally{
    db.close();
  }
}

async function deleteGalleryEntryFromDB(id){
  const db=await openGalleryDB();
  try{
    const tx=db.transaction([GALLERY_PROJECTS_STORE,GALLERY_ASSETS_STORE],'readwrite');
    const done=idbTransactionDone(tx);
    tx.objectStore(GALLERY_PROJECTS_STORE).delete(id);
    tx.objectStore(GALLERY_ASSETS_STORE).delete(`${id}:source`);
    tx.objectStore(GALLERY_ASSETS_STORE).delete(`${id}:thumbnail`);
    await done;
  }finally{
    db.close();
  }
}

async function loadGalleryFromDB(){
  const db=await openGalleryDB();
  try{
    const tx=db.transaction([GALLERY_PROJECTS_STORE,GALLERY_ASSETS_STORE],'readonly');
    const done=idbTransactionDone(tx);
    const [projects,assets]=await Promise.all([
      idbRequest(tx.objectStore(GALLERY_PROJECTS_STORE).getAll()),
      idbRequest(tx.objectStore(GALLERY_ASSETS_STORE).getAll()),
    ]);
    await done;
    const assetMap=new Map(assets.map(asset=>[asset.id,asset]));
    const objectUrls=[];
    const items=projects
      .sort((a,b)=>(a.position??9999)-(b.position??9999))
      .map(project=>{
        const sourceBlob=assetMap.get(`${project.id}:source`)?.blob||null;
        const thumbnailBlob=assetMap.get(`${project.id}:thumbnail`)?.blob||null;
        const sourceUrl=sourceBlob?URL.createObjectURL(sourceBlob):null;
        const thumbUrl=thumbnailBlob?URL.createObjectURL(thumbnailBlob):sourceUrl;
        if(sourceUrl)objectUrls.push(sourceUrl);
        if(thumbUrl&&thumbUrl!==sourceUrl)objectUrls.push(thumbUrl);
        return {
          id:project.id,
          date:project.date,
          createdAt:project.createdAt,
          updatedAt:project.updatedAt,
          dataUrl:null,
          thumbUrl,
          editState:project.editState?{...project.editState,imageSrc:sourceUrl}:null,
        };
      });
    return {items,objectUrls};
  }finally{
    db.close();
  }
}

async function migrateLegacyGallery(){
  const db=await openGalleryDB();
  try{
    const checkTx=db.transaction(GALLERY_META_STORE,'readonly');
    const checkDone=idbTransactionDone(checkTx);
    const previous=await idbRequest(checkTx.objectStore(GALLERY_META_STORE).get(LEGACY_MIGRATION_KEY));
    await checkDone;
    if(previous) return {...previous,alreadyProcessed:true};

    let legacy=[];
    try{
      const raw=localStorage.getItem(LEGACY_GALLERY_KEY);
      legacy=raw?JSON.parse(raw):[];
      if(!Array.isArray(legacy)) legacy=[];
    }catch{
      const result={key:LEGACY_MIGRATION_KEY,status:'failed',total:0,migrated:0,failed:1,finishedAt:Date.now()};
      const tx=db.transaction(GALLERY_META_STORE,'readwrite');
      const done=idbTransactionDone(tx);
      tx.objectStore(GALLERY_META_STORE).put(result);
      await done;
      return result;
    }

    const candidates=legacy.slice(0,24);
    const prepared=[];
    let failed=0;
    for(let i=0;i<candidates.length;i++){
      const entry=candidates[i];
      if(!entry||entry.id==null){failed++;continue;}
      try{
        const entryAssets=await assetsFromEntry(entry);
        prepared.push({entry,position:i,assets:entryAssets});
      }catch{
        failed++;
      }
    }

    const result={
      key:LEGACY_MIGRATION_KEY,
      status:failed?'partial':'complete',
      total:candidates.length,
      migrated:prepared.length,
      failed,
      finishedAt:Date.now(),
    };
    const tx=db.transaction([GALLERY_PROJECTS_STORE,GALLERY_ASSETS_STORE,GALLERY_META_STORE],'readwrite');
    const done=idbTransactionDone(tx);
    const projects=tx.objectStore(GALLERY_PROJECTS_STORE);
    const assets=tx.objectStore(GALLERY_ASSETS_STORE);
    prepared.forEach(item=>{
      projects.put(projectRecordFromEntry(item.entry,item.position));
      if(item.assets.source) assets.put(item.assets.source);
      if(item.assets.thumbnail) assets.put(item.assets.thumbnail);
    });
    tx.objectStore(GALLERY_META_STORE).put(result);
    await done;
    // 旧localStorageは移行確認・ロールバック用として意図的に削除しない。
    return result;
  }finally{
    db.close();
  }
}

  const drawCropCanvas=useCallback(()=>{

    ctx.drawImage(img,0,0);

      ctx.fillStyle='rgba(255,255,255,.92)';

      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('ドラッグして範囲を作る',img.width/2,img.height/2);
      return;
    }
    ctx.fillStyle='rgba(117,109,137,.40)'; ctx.fillRect(0,0,img.width,img.height);
    ctx.clearRect(crop.x,crop.y,crop.w,crop.h);
    ctx.drawImage(img,crop.x,crop.y,crop.w,crop.h,crop.x,crop.y,crop.w,crop.h);
    const lw=Math.max(2,img.width/120);

      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✦',crop.x+crop.w/2,crop.y+crop.h/2);
    }

    [[crop.x,crop.y],[crop.x+crop.w,crop.y],[crop.x,crop.y+crop.h],[crop.x+crop.w,crop.y+crop.h]].forEach(([hx,hy])=>{

    const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

    };
    const onMove=(cx,cy)=>{
      const d=dragRef.current; if(!d.active)return;
      const pos=toImg(cx,cy); const iw=img.width,ih=img.height,MIN=30;
      if(d.mode==='move'){
        const dx=pos.x-d.startX, dy=pos.y-d.startY;

        if(d.handle==='tr'){w=cl(c0.w+dx,MIN,iw-c0.x);y=cl(c0.y+dy,0,c0.y+c0.h-MIN);h=c0.y+c0.h-y;}
        if(d.handle==='bl'){x=cl(c0.x+dx,0,c0.x+c0.w-MIN);w=c0.x+c0.w-x;h=cl(c0.h+dy,MIN,ih-c0.y);}

    const mM=e=>{if(!dragRef.current.active)return;e.preventDefault();onMove(e.clientX,e.clientY);};

  // ── save (iPhone Safari対応) ──
  const classifyGallerySaveError=(err)=>{
    const name=err?.name||'';
    const message=String(err?.message||'');
    if(name==='QuotaExceededError'||/quota|storage.*full|disk.*full/i.test(message)){
      return {kind:'quota',message:'保存容量が不足しているため、自動保存できませんでした'};
    }
    if(['AbortError','ConstraintError','TransactionInactiveError'].includes(name)){
      return {kind:'conflict',message:'保存処理が競合しました。最新の変更をもう一度保存します'};
    }
    if(name==='InvalidStateError'||/indexeddb|transaction|database/i.test(message)){
      return {kind:'indexeddb',message:'ブラウザの保存機能でエラーが発生しました'};
    }
    if(name==='NotFoundError'||/failed to fetch|image data|blob/i.test(message)){
      return {kind:'asset',message:'既存作品の画像データを更新できませんでした'};

  // ギャラリーへの保存だけを行う（共有ダイアログは出さない）。ホームボタンからの自動保存用にも使う
  // mode: 'new'=常に新規追加, 'overwrite'=編集元があればそれを上書き, 未指定=編集元があれば自動で上書き
  const saveSnapshotToGallery=async(mode)=>{
    // 自動保存・Preview遷移・明示保存など、すべてのIndexedDB書き込みを同じ列へ並べる。
    // 前の処理が終わるまで次を開始しないため、保存中を競合エラーとして扱わない。
    const previous=gallerySaveTailRef.current;
    let releaseTurn;
    const thisTurn=new Promise(resolve=>{releaseTurn=resolve;});
    gallerySaveTailRef.current=previous.catch(()=>{}).then(()=>thisTurn);
    await previous.catch(()=>{});
    savingRef.current=true;
    setIsSaving(true);

      const dataUrl=createCurrentImageDataUrl();
      if(!dataUrl)throw new Error('canvas is not ready');
      // ギャラリーに保存（サムネイル用に小さく）
      const thumb = document.createElement('canvas');
      thumb.width=240;thumb.height=426;
      thumb.getContext('2d').drawImage(previewRef.current,0,0,CW*RENDER_SCALE,CH*RENDER_SCALE,0,0,240,426);
      const thumbUrl = thumb.toDataURL('image/jpeg',0.85);
      const currentEditingId=editingGalleryIdRef.current;
      const currentGallery=galleryRef.current;
      const useMode = mode || (currentEditingId ? 'overwrite' : 'new');
      const existing=(useMode==='overwrite'&&currentEditingId)?currentGallery.find(g=>g.id===currentEditingId):null;
      // 一覧内の検索結果ではなく、引き継いだ作品IDを上書き判定の基準にする。
      // Reactの更新境界で一覧が一時的に古くても、別IDの新規作品を作らない。
      const isOverwrite=useMode==='overwrite'&&currentEditingId!=null;
      const entry = {
        id:isOverwrite?currentEditingId:Date.now(),
        date:new Date().toLocaleDateString('ja-JP'),
        createdAt:existing?.createdAt||Date.now(),
        updatedAt:Date.now(),
        dataUrl,
        thumbUrl,
        editState:createEditState(),
      };
      let next;
      if(isOverwrite){
        const containsTarget=currentGallery.some(g=>g.id===currentEditingId);
        next = containsTarget
          ? currentGallery.map(g=>g.id===currentEditingId?entry:g)
          : [entry,...currentGallery].slice(0,24);
      } else {
        next=[entry,...currentGallery].slice(0,24); // 最大24件
      }
      const nextIds=new Set(next.map(g=>g.id));
      const removedIds=currentGallery.filter(g=>!nextIds.has(g.id)).map(g=>g.id);
      const sourceSrc=entry.editState?.imageSrc||'';
      const preserveSource=isOverwrite&&sourceSrc.startsWith('blob:');
      await persistGallerySnapshot(next,entry,removedIds,{preserveSource});
      galleryRef.current=next;
      editingGalleryIdRef.current=entry.id;
      setGallery(next);
      setEditingGalleryId(entry.id); // 以降はこの作品として追跡する

              vt.pinching=false;vt.dragging=false;vt.lastDist=0;
              return;
            }

              vt.pinching=false;vt.dragging=false;
              return;
            }

            if(e.touches.length===0)gestureOwnerRef.current=null;
            setSnapGuide({x:false,y:false});

              vt.lastX=e.touches[0].clientX;

            } else if(e.touches.length===0){

            }

              selectCanvasText({kind:completedTextGesture.kind||'free',id:completedTextGesture.id},true);
              vt.dragging=false;
              return;
            }
            if(completedTextGesture.mode==='move'||completedTextGesture.mode==='rotate'||completedTextGesture.mode==='finishing'){
              vt.dragging=false;
              return;

            }

                <HL><b>Saving...</b> または <b>Saved 15:20</b> のように、</HL>
                <HL>保存状態が表示されます。</HL><HGap/>
                <HL><b>Save</b>から、</HL>
                <HL>カメラロール保存または</HL>
                <HL>ギャラリーへの手動保存を選べます。</HL><HGap/>
                <HL>カメラロールへ、</HL>
                <HL>高画質PNGで保存できます。</HL><HGap/>
                <HL>保存画像には、</HL>
                <HL>余白ガイド・センターガイド・編集UIは含まれません。</HL><HGap/>
                <HL><b>Preview</b>での表示倍率や位置は、</HL>
                <HL>保存画像へ反映されません。</HL><HGap/>
                <HL>共有機能が利用できない環境では、</HL>
                <HL>長押し保存画面へ切り替わります。</HL>
              </div>],
              ['♡ ギャラリー',<div>
                <HL>編集内容は自動保存されるため、</HL>
                <HL>保存忘れを防げます。</HL><HGap/>
                <HL>保存した作品は、</HL>
                <HL>ギャラリーから後で編集できます。</HL><HGap/>
                <HL>既存作品を開いて編集すると、</HL>
                <HL>同じ作品へ上書き保存されます。</HL><HGap/>
                <HL><b>複製</b> を使うと、</HL>
                <HL>同じ内容を新しい作品として編集できます。</HL><HGap/>
                <HL>新しく作る場合は、</HL>
                <HL><b>＋ 新しく作る</b> から始めます。</HL>
              </div>],
              ['♡ Reset',<div>
                <HL>最初からやり直したい時は、</HL>
                <HL>上部の<b>Reset</b>を使います。</HL><HGap/>
                <HL>確認画面でリセットを選ぶと、</HL>
                <HL>現在の編集内容が初期状態へ戻ります。</HL>
              </div>],
              ['♡ 全画面で使う方法',<div>
                <HL>1. Safari下部の共有ボタン（↑）をタップ</HL>
                <HL>2. <b>ホーム画面に追加</b> を選択</HL>
                <HL>3. <b>追加</b> を押すと、</HL>
                <HL>アプリのように全画面で使えます。</HL>
              </div>],
              ['♡ ご利用について',<div>
                <HL>作品データは、</HL>
                <HL>この端末のSafariに保存されます。</HL><HGap/>
                <HL>Safariの</HL>
                <HL><b>Webサイトデータを削除</b> を実行すると、</HL>
                <HL>作品データも削除されます。</HL><HGap/>
                <HL>別の端末や別のブラウザへ</HL>
                <HL>作品データは自動で引き継がれません。</HL>
              </div>],
            ].map(([heading,content])=>(
              <section key={heading} style={{marginBottom:14}}>
                <div style={{fontWeight:700,fontSize:'.82rem',color:'#B685C1',marginBottom:6}}>{heading}</div>
                <div className="hint-copy" style={{width:'100%',maxWidth:'100%',background:'#FDF7FC',border:'1.5px solid #F0DFF0',borderRadius:14,padding:'14px 12px',fontSize:'.75rem',lineHeight:1.9,color:'#8A7A9C',fontFeatureSettings:'"palt"',letterSpacing:'-.02em',overflowX:'visible'}}>{content}</div>
              </section>
            ))}
            <button onClick={()=>setShowHowTo(false)}
              style={{width:'100%',padding:'13px',background:'linear-gradient(135deg,#D4B3D9,#C8A8C8)',color:'#fff',border:'none',borderRadius:14,fontFamily:'inherit',fontSize:'.92rem',fontWeight:700,cursor:'pointer',boxShadow:'0 6px 16px rgba(200,168,200,.4)'}}>
              OK！
            </button>
            <div style={{textAlign:'center',fontSize:'.58rem',lineHeight:1.55,color:'#B8AAC4',marginTop:12,letterSpacing:'.02em'}}>
              <div>v1.0</div>
              <div style={{marginTop:4}}>made with ♡ by mpi.</div>
            </div>
          </div>
        </div>
      )}

      {/* Full Preview modal */}
      {showFullPreview&&(
        <div data-undo-ignore="true" style={{position:'fixed',inset:0,background:'var(--ui-bg)',display:'flex',flexDirection:'column',zIndex:400}}>
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',minHeight:0}}>
            <div
              ref={previewViewportRef}
              onTouchStart={e=>{
                e.preventDefault();e.stopPropagation();
                const owner=gestureOwnerRef.current;
                const content=previewContentRef.current||e.currentTarget;
                let started=false;
                if(owner==='preview'){
                  if(e.touches.length===2)beginPreviewViewGesture(e.currentTarget,e.touches);
                  return;
                }
                if(e.touches.length===2&&(owner==='textPending'||!owner)){
                  started=beginTwoFingerTextGesture(content,e.touches,null,true);
                  if(!started){
                    const previousGesture=freeTextGestureRef.current;
                    const previousDraft=previewTextDraftRef.current;
                    if(previousDraft&&previousGesture.mode==='move'){
                      updateFreeText(previousDraft.id,{x:previousDraft.x,y:previousDraft.y});
                    }
                    freeTextGestureRef.current={mode:null,id:null};
                    previewTextDraftRef.current=null;
                    gestureOwnerRef.current='preview';
                    updateRotationSnapGuide(false);
                    beginPreviewViewGesture(e.currentTarget,e.touches);
                    setSnapGuide({x:false,y:false});
                    scheduleUndoCommit();
                    setPreviewShareRevision(v=>v+1);
                    return;
                  }
                }else if(e.touches.length===1&&!owner){
                  started=beginSingleTextGesture(content,e.touches[0],true);
                  if(!started){
                    gestureOwnerRef.current='preview';
                    updateRotationSnapGuide(false);
                    beginPreviewViewGesture(e.currentTarget,e.touches);
                    setSnapGuide({x:false,y:false});
                    setPreviewShareRevision(v=>v+1);
                    return;
                  }
                }else if(owner==='text'){
                  return;
                }
                if(started){
                  gestureOwnerRef.current=e.touches.length===2?'text':'textPending';
                  beginUndoTransaction();
                  beginPreviewTextDraft();
                  setPreviewShare(null);
                  setPreviewPreparing(false);
                  setPreviewShareRevision(v=>v+1); // 予約中の共有画像生成をキャンセル
                }
              }}
              onTouchMove={e=>{
                e.preventDefault();e.stopPropagation();
                const owner=gestureOwnerRef.current;
                if(owner==='text'||owner==='textPending'){
                  movePreviewTextGesture(previewContentRef.current||e.currentTarget,e.touches);
                }else if(owner==='preview'){
                  movePreviewViewGesture(e.currentTarget,e.touches);
                }
              }}
              onTouchEnd={e=>{
                e.preventDefault();e.stopPropagation();
                const g=freeTextGestureRef.current;
                const draft=previewTextDraftRef.current;
                if(gestureOwnerRef.current==='preview'){
                  if(e.touches.length===1){
                    beginPreviewViewGesture(e.currentTarget,e.touches);
                  }else if(e.touches.length===0){
                    previewViewRef.current.mode=null;
                    gestureOwnerRef.current=null;
                    setPreviewShareRevision(v=>v+1);
                  }
                  return;
                }
                const shouldFinish=!!g.mode&&e.touches.length===0;
                if(shouldFinish){
                  updateRotationSnapGuide(false);
                  if(previewMoveRafRef.current){
                    cancelAnimationFrame(previewMoveRafRef.current);
                    previewMoveRafRef.current=0;
                    paintPreviewTextDraft();
                  }
                  if(draft&&(g.mode==='move'||g.mode==='rotate')){
                    updateFreeText(draft.id,{x:draft.x,y:draft.y,size:Math.round(draft.size),rotation:draft.rotation});
                  }else if(g.mode==='pending'&&!g.moved){
                    selectCanvasText({kind:'free',id:g.id},true);
                  }
                  previewTextDraftRef.current=null;
                  freeTextGestureRef.current={mode:null,id:null};
                  gestureOwnerRef.current=null;
                  setSnapGuide({x:false,y:false});
                  setPreviewShareRevision(v=>v+1);
                  scheduleUndoCommit();
                }
              }}
              onTouchCancel={e=>{
                e.preventDefault();e.stopPropagation();
                const wasPreview=gestureOwnerRef.current==='preview';
                if(previewMoveRafRef.current){
                  cancelAnimationFrame(previewMoveRafRef.current);
                  previewMoveRafRef.current=0;
                }
                previewViewRef.current.mode=null;
                previewTextDraftRef.current=null;
                freeTextGestureRef.current={mode:null,id:null};
                gestureOwnerRef.current=null;
                updateRotationSnapGuide(false);
                setSnapGuide({x:false,y:false});
                if(wasPreview)setPreviewShareRevision(v=>v+1);
                else scheduleUndoCommit();
              }}
              style={{position:'relative',height:'100%',width:'100%',display:'flex',alignItems:'center',justifyContent:'center',touchAction:'none',overflow:'hidden'}}>
              <div ref={previewFrameRef}
                style={{position:'relative',height:'100%',width:'auto',maxWidth:'100%',aspectRatio:'9/16',background:'transparent',border:'none',boxShadow:'none',overflow:'visible',flexShrink:1}}>
                <div ref={previewContentRef}
                  style={{position:'absolute',inset:0,transformOrigin:'0 0',willChange:'transform',overflow:'hidden',clipPath:'inset(0)'}}>
                <canvas width={CW*RENDER_SCALE} height={CH*RENDER_SCALE} ref={fullPreviewRef}
                  style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block'}}/>
                <svg viewBox={`0 0 ${CW} ${CH}`} preserveAspectRatio="none"
                  style={{position:'absolute',inset:0,width:'100%',height:'100%',display:'block',overflow:'hidden',pointerEvents:'none'}}>
                  {freeTexts.map(ft=>ft.text&&ft.text.trim()?(
                    <text key={ft.id} ref={el=>{previewTextNodeRefs.current[ft.id]=el;}}
                      x={ft.x} y={ft.y} transform={`rotate(${ft.rotation||0} ${ft.x} ${ft.y})`}
                      fill={ft.color||'#3D4458'} fontFamily={ft.font||"'Playfair Display', serif"}
                      fontSize={ft.size||28} fontWeight={ft.bold?700:400}
                      textAnchor="middle" dominantBaseline="central">{ft.text}</text>
                  ):null)}
                </svg>
                {snapGuide.x&&(
                  <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:'calc(1px / var(--preview-view-scale, 1))',background:'#C8A8C8',boxShadow:'0 0 4px rgba(200,168,200,.8)',pointerEvents:'none',zIndex:3}}/>
                )}
                {snapGuide.y&&(
                  <div style={{position:'absolute',top:'50%',left:0,right:0,height:'calc(1px / var(--preview-view-scale, 1))',background:'#C8A8C8',boxShadow:'0 0 4px rgba(200,168,200,.8)',pointerEvents:'none',zIndex:3}}/>
                )}
                <div ref={previewRotationGuideRef} aria-hidden="true"
                  style={{position:'absolute',display:'none',left:0,right:0,height:'calc(1px / var(--preview-view-scale, 1))',pointerEvents:'none',zIndex:4,opacity:.58,background:'repeating-linear-gradient(90deg,#9F7BC2 0 7px,transparent 7px 12px)',boxShadow:'0 0 3px rgba(159,123,194,.28)'}}/>
                </div>
              </div>
            </div>
          </div>
          <div style={{flexShrink:0,padding:'12px 20px 40px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,maxWidth:430,width:'100%',margin:'0 auto',background:'var(--ui-bg)'}}>
            <button disabled={previewPreparing||!previewShare}
              onClick={()=>{if(previewShare&&!previewPreparing)sharePreparedImage(previewShare);}}
              style={{padding:'13px 8px',background:previewPreparing?'#766D79':'#C8A8C8',color:'#fff',border:'none',borderRadius:24,fontFamily:'inherit',fontSize:'.76rem',fontWeight:800,cursor:previewPreparing?'default':'pointer',boxShadow:'0 2px 12px rgba(0,0,0,.3)',whiteSpace:'nowrap'}}>
              {previewPreparing||!previewShare?'共有を準備中…':'iPhoneに保存・共有'}
            </button>
            <button onClick={()=>{freeTextGestureRef.current={mode:null,id:null};gestureOwnerRef.current=null;updateRotationSnapGuide(false);setSnapGuide({x:false,y:false});setShowFullPreview(false);}}
              style={{padding:'13px 10px',background:'#fff',color:'#3D4458',border:'none',borderRadius:24,fontFamily:'inherit',fontSize:'.82rem',fontWeight:700,cursor:'pointer',boxShadow:'0 2px 12px rgba(0,0,0,.3)'}}>
              編集に戻る
            </button>
          </div>
        </div>
      )}
      {/* Crop modal */}
      {showCrop&&img&&(
        <div data-undo-ignore="true" style={{position:'fixed',inset:0,background:'var(--ui-bg)',display:'flex',flexDirection:'column',zIndex:300,touchAction:'none'}}>
          <div style={{padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
            <span style={{color:'var(--ui-ink)',fontFamily:"'DM Sans','Plus Jakarta Sans',sans-serif",fontWeight:600,fontSize:'1rem'}}>トリミング</span>
            <span style={{color:'var(--ui-muted)',fontSize:'.62rem',letterSpacing:'.07em'}}>ドラッグして枠を作成</span>
          </div>
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden',minHeight:0}}>
            <canvas ref={cropCvRef} style={{maxWidth:'100%',maxHeight:'100%',display:'block',touchAction:'none'}}/>
          </div>
          <div style={{padding:'14px 20px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,flexShrink:0}}>
            <button onClick={()=>{setFitMode('contain');setFinalCrop(null);setShowCrop(false);}}
              style={{padding:'13px',border:'1px solid var(--ui-border)',borderRadius:4,background:'var(--ui-panel)',color:'var(--ui-muted)',fontSize:'.84rem',cursor:'pointer',fontFamily:'inherit'}}>
              そのまま使う
            </button>
            <button onClick={()=>{if(crop&&crop.w>10){setFinalCrop(crop);setFitMode('trim');setShowCrop(false);}}}
              disabled={!crop||crop.w<10}
              style={{padding:'13px',background:crop&&crop.w>10?'var(--ui-accent)':'#E4DFEA',color:crop&&crop.w>10?'#fff':'#AAA3B1',border:'none',borderRadius:4,fontSize:'.84rem',cursor:crop&&crop.w>10?'pointer':'default',fontFamily:'inherit',fontWeight:500}}>
              Apply ✓
            </button>
          </div>
        </div>
      )}

      <canvas ref={hiddenRef} style={{display:'none'}}/>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<PaletteStory/>);
</script>
</body>
</html>
